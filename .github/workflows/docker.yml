name: Build and Publish Docker Image

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'

      - uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request'
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false

      - uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request'
        with:
          context: .
          file: deploy/task-proxy.Dockerfile
          platforms: linux/amd64
          push: false

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_METADATA_SHORT_SHA_LENGTH: 12
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rebecca554owen/gpt_image_playground
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - id: meta-task-proxy
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rebecca554owen/gpt_image_playground-task-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/task-proxy.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-task-proxy.outputs.tags }}
          labels: ${{ steps.meta-task-proxy.outputs.labels }}
