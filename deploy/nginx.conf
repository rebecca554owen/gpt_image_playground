log_format api_timing '$remote_addr [$time_local] "$request" '
                      'status=$status bytes=$body_bytes_sent request_time=$request_time '
                      'upstream_status=$upstream_status upstream_connect_time=$upstream_connect_time '
                      'upstream_header_time=$upstream_header_time upstream_response_time=$upstream_response_time '
                      'request_id=$request_id upstream_request_id=$upstream_http_x_request_id';

server {
    listen ${HOST}:${PORT};
    server_name _;

    # 站点端口只绑定宿主机回环地址；仅信任本机与 Docker 私网中的前置代理。
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;
    add_header Referrer-Policy "unsafe-url" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成的带 hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # BEGIN API PROXY
    # API 代理。前端请求同源 /api-proxy/...，由 Nginx 转发到部署时配置的 API_PROXY_URL。
    location /api-proxy/ {
        limit_except POST OPTIONS {
            deny all;
        }

        if ($uri = "/api-proxy/") {
            return 403 "Forbidden: API Proxy path required";
        }

        proxy_pass ${API_PROXY_URL}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        send_timeout 1200s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
        access_log /var/log/nginx/access.log api_timing;
    }
    # END API PROXY

    # BEGIN IMAGE JOBS
    # 同源短请求提交和轮询；长耗时上游连接由独立任务服务持有。
    location /task-api/ {
        limit_except PUT GET DELETE OPTIONS {
            deny all;
        }

        proxy_pass ${IMAGE_JOB_PROXY_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        # real_ip 模块已校验可信代理链，只向 sidecar 传递规范化后的真实用户 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 60s;
        send_timeout 60s;
        proxy_request_buffering on;
        proxy_buffering off;
        access_log /var/log/nginx/access.log api_timing;
    }
    # END IMAGE JOBS

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
